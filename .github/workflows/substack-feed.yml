name: Refresh Substack feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feed
        run: |
          curl -sfL -A "Mozilla/5.0 (devpal.in feed refresh)" https://dpal.substack.com/feed -o feed.tmp
          grep -q '<item>' feed.tmp
          sed -E 's#<lastBuildDate>[^<]*</lastBuildDate>##' feed.tmp > substack-feed.xml
          rm feed.tmp

      - name: Commit if changed
        run: |
          git diff --quiet -- substack-feed.xml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack-feed.xml
          git commit -m "Refresh Substack feed"
          git push
